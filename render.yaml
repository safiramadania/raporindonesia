services:
  - type: web
    name: ruang-sekolah
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: public
